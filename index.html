<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e8d8ae" />
  <title>Scorecard</title>
  <style>
    :root{
      --paper:#eadbb3;
      --paper-dark:#d4bd83;
      --ink:#1f2b2b;
      --line:#39413d;
      --panel:#f4e9c9;
      --button:#fffaf0;
      --button-active:#e7dcc0;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,.34), transparent 24%),
        linear-gradient(160deg, #f2e6c5 0%, #d9c391 100%);
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", "SF Pro Display", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(14px, env(safe-area-inset-top))
               max(14px, env(safe-area-inset-right))
               max(14px, env(safe-area-inset-bottom))
               max(14px, env(safe-area-inset-left));
    }

    .app {
      width: min(100%, 560px);
      background: rgba(235, 218, 173, .96);
      border: 2px solid rgba(63, 58, 43, .45);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 14px 38px rgba(55, 44, 20, .28);
    }

    .titlebar {
      padding: 14px 16px 10px;
      text-align: center;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
      font-size: clamp(18px, 5vw, 24px);
    }

    .score-grid {
      display: grid;
      grid-template-columns: 76px 1fr 1fr;
      border-top: 2px solid var(--line);
      border-left: 2px solid var(--line);
      border-right: 2px solid var(--line);
      margin: 0 10px 10px;
      background: #fff;
    }

    .cell {
      min-width: 0;
      min-height: 72px;
      border-right: 2px solid var(--line);
      border-bottom: 2px solid var(--line);
    }

    .cell:nth-child(3n) { border-right: 0; }

    .head {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f2e6;
      font-weight: 900;
      font-size: clamp(15px, 4.5vw, 20px);
      text-align: center;
      padding: 6px;
    }

    .icon-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: var(--row-color);
    }

    .controls {
      display: grid;
      grid-template-columns: 46px 1fr 46px;
      align-items: center;
      gap: 5px;
      padding: 8px 7px;
      background: color-mix(in srgb, var(--row-color) 30%, white);
    }

    .score {
      text-align: center;
      font-size: clamp(23px, 7vw, 34px);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    button.score-btn {
      width: 46px;
      height: 46px;
      border: 1.5px solid rgba(32, 39, 36, .35);
      border-radius: 12px;
      background: rgba(255,255,255,.82);
      color: #1d2624;
      font-size: 28px;
      line-height: 1;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 2px 0 rgba(0,0,0,.13);
      touch-action: manipulation;
      user-select: none;
    }

    button.score-btn:active {
      transform: translateY(1px);
      box-shadow: none;
      background: var(--button-active);
    }

    /* Original score-card inspired colours */
    .r-blue   { --row-color: #b8d6e4; }
    .r-green  { --row-color: #bfd7b3; }
    .r-yellow { --row-color: #eadb91; }
    .r-purple { --row-color: #c9bfd5; }
    .r-wonder { --row-color: #c9cfaa; }
    .r-token1 { --row-color: #c9dcbe; }
    .r-token2 { --row-color: #eadc9b; }
    .r-red    { --row-color: #d6b4a8; }

    .square {
      width: 32px;
      height: 42px;
      border: 3px solid rgba(26,40,38,.25);
      border-radius: 2px;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.12);
    }
    .square.blue   { background:#2f648b; }
    .square.green  { background:#26865f; }
    .square.yellow { background:#e3a816; }
    .square.purple { background:#5e4b75; }

    .diamond {
      width: 42px;
      height: 42px;
      transform: rotate(45deg);
      overflow: hidden;
      border: 2px solid rgba(32,40,34,.30);
      border-radius: 3px;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .diamond span:first-child { background:#e5af22; }
    .diamond span:last-child  { background:#62533a; }

    .coin {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 4px solid rgba(57,72,53,.32);
      box-shadow: inset 0 0 0 3px rgba(255,255,255,.13);
    }
    .coin.green { background:#247b4c; }
    .coin.gold  { background:#bb9125; }

    .military {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      position: relative;
      background:
        linear-gradient(45deg, transparent 43%, #6b2830 44% 56%, transparent 57%),
        linear-gradient(-45deg, transparent 43%, #6b2830 44% 56%, transparent 57%),
        #b67b6b;
      border: 3px solid rgba(71,53,49,.45);
    }
    .military::before,
    .military::after{
      content:"";
      position:absolute;
      left:21px;
      top:5px;
      width:4px;
      height:36px;
      background:#4c4a45;
      border-radius:4px;
      transform-origin:center;
    }
    .military::before{ transform:rotate(45deg); }
    .military::after{ transform:rotate(-45deg); }

    .total-label {
      display:flex;
      align-items:center;
      justify-content:center;
      background:#2f3734;
      color:white;
      font-family: Georgia, serif;
      font-size: 42px;
      font-weight: 700;
    }

    .total-cell {
      display:flex;
      align-items:center;
      justify-content:center;
      min-height: 76px;
      background:#f7f2e6;
      font-size: clamp(28px, 8vw, 40px);
      font-weight: 950;
      font-variant-numeric: tabular-nums;
    }

    .bottom-actions {
      display:flex;
      justify-content:center;
      padding: 2px 12px 14px;
    }

    .reset {
      min-height: 46px;
      border: 1.5px solid rgba(45,42,34,.35);
      border-radius: 12px;
      padding: 0 18px;
      background:#f8efd9;
      color:#382f23;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
    }

    .reset:active { transform: translateY(1px); }

    @media (max-width: 420px) {
      body { padding: 8px; align-items: flex-start; }
      .app { border-radius: 13px; }
      .titlebar { padding: 9px 12px 7px; }
      .score-grid {
        grid-template-columns: 62px minmax(0,1fr) minmax(0,1fr);
        margin: 0 6px 7px;
      }
      .cell { min-height: 63px; }
      .head { min-height: 51px; font-size: 15px; }
      .controls {
        grid-template-columns: 39px minmax(28px, 1fr) 39px;
        gap: 3px;
        padding: 6px 4px;
      }
      button.score-btn {
        width: 39px;
        height: 43px;
        border-radius: 10px;
        font-size: 25px;
      }
      .score { font-size: 25px; }
      .square { width: 27px; height: 35px; }
      .diamond { width: 35px; height: 35px; }
      .coin { width: 38px; height: 38px; }
      .military { width: 40px; height: 40px; }
      .military::before, .military::after { left:17px; top:3px; height:31px; }
      .bottom-actions { padding-bottom: 10px; }
    }

    @media (max-width: 340px) {
      .score-grid { grid-template-columns: 52px minmax(0,1fr) minmax(0,1fr); }
      .controls { grid-template-columns: 34px minmax(24px,1fr) 34px; padding: 5px 2px; }
      button.score-btn { width:34px; height:40px; font-size:23px; }
      .score { font-size:22px; }
      .head { font-size:13px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="titlebar">Scorecard</div>

    <section class="score-grid" id="scoreGrid" aria-label="Two player scorecard">
      <div class="cell head" aria-hidden="true"></div>
      <div class="cell head">Player 1</div>
      <div class="cell head">Player 2</div>

      <div class="cell icon-cell r-blue"><div class="square blue" aria-label="Blue"></div></div>
      <div class="cell controls r-blue" data-row="0" data-player="0"></div>
      <div class="cell controls r-blue" data-row="0" data-player="1"></div>

      <div class="cell icon-cell r-green"><div class="square green" aria-label="Green"></div></div>
      <div class="cell controls r-green" data-row="1" data-player="0"></div>
      <div class="cell controls r-green" data-row="1" data-player="1"></div>

      <div class="cell icon-cell r-yellow"><div class="square yellow" aria-label="Yellow"></div></div>
      <div class="cell controls r-yellow" data-row="2" data-player="0"></div>
      <div class="cell controls r-yellow" data-row="2" data-player="1"></div>

      <div class="cell icon-cell r-purple"><div class="square purple" aria-label="Purple"></div></div>
      <div class="cell controls r-purple" data-row="3" data-player="0"></div>
      <div class="cell controls r-purple" data-row="3" data-player="1"></div>

      <div class="cell icon-cell r-wonder">
        <div class="diamond" aria-label="Wonder"><span></span><span></span></div>
      </div>
      <div class="cell controls r-wonder" data-row="4" data-player="0"></div>
      <div class="cell controls r-wonder" data-row="4" data-player="1"></div>

      <div class="cell icon-cell r-token1"><div class="coin green" aria-label="Green token"></div></div>
      <div class="cell controls r-token1" data-row="5" data-player="0"></div>
      <div class="cell controls r-token1" data-row="5" data-player="1"></div>

      <div class="cell icon-cell r-token2"><div class="coin gold" aria-label="Gold token"></div></div>
      <div class="cell controls r-token2" data-row="6" data-player="0"></div>
      <div class="cell controls r-token2" data-row="6" data-player="1"></div>

      <div class="cell icon-cell r-red"><div class="military" aria-label="Military"></div></div>
      <div class="cell controls r-red" data-row="7" data-player="0"></div>
      <div class="cell controls r-red" data-row="7" data-player="1"></div>

      <div class="cell total-label">Σ</div>
      <div class="cell total-cell" id="total0">0</div>
      <div class="cell total-cell" id="total1">0</div>
    </section>

    <div class="bottom-actions">
      <button class="reset" id="resetBtn" type="button">New game / reset scores</button>
    </div>
  </main>

  <script>
    const ROWS = 8;
    const STORAGE_KEY = "two-player-scorecard-v1";
    let scores = Array.from({ length: ROWS }, () => [0, 0]);

    function loadScores() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (
          Array.isArray(saved) &&
          saved.length === ROWS &&
          saved.every(row => Array.isArray(row) && row.length === 2)
        ) {
          scores = saved.map(row => row.map(v => Math.max(0, Number(v) || 0)));
        }
      } catch (_) {}
    }

    function saveScores() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(scores)); } catch (_) {}
    }

    function makeControls(el) {
      const row = Number(el.dataset.row);
      const player = Number(el.dataset.player);

      const minus = document.createElement("button");
      minus.type = "button";
      minus.className = "score-btn";
      minus.textContent = "−";
      minus.setAttribute("aria-label", `Subtract one from player ${player + 1}, row ${row + 1}`);

      const value = document.createElement("div");
      value.className = "score";
      value.id = `score-${row}-${player}`;
      value.setAttribute("aria-live", "polite");

      const plus = document.createElement("button");
      plus.type = "button";
      plus.className = "score-btn";
      plus.textContent = "+";
      plus.setAttribute("aria-label", `Add one to player ${player + 1}, row ${row + 1}`);

      minus.addEventListener("click", () => changeScore(row, player, -1));
      plus.addEventListener("click", () => changeScore(row, player, 1));

      el.append(minus, value, plus);
    }

    function changeScore(row, player, amount) {
      scores[row][player] = Math.max(0, scores[row][player] + amount);
      saveScores();
      render();
    }

    function render() {
      for (let r = 0; r < ROWS; r++) {
        for (let p = 0; p < 2; p++) {
          document.getElementById(`score-${r}-${p}`).textContent = scores[r][p];
        }
      }

      for (let p = 0; p < 2; p++) {
        const total = scores.reduce((sum, row) => sum + row[p], 0);
        document.getElementById(`total${p}`).textContent = total;
      }
    }

    document.querySelectorAll(".controls").forEach(makeControls);

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (!confirm("Reset both players' scores to zero?")) return;
      scores = Array.from({ length: ROWS }, () => [0, 0]);
      saveScores();
      render();
    });

    loadScores();
    render();
  </script>
</body>
</html>
